{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Training Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            Employee Training Tracker
        </a>

        <div>

            <a href="{% url 'employee_list' %}" class="btn btn-light btn-sm">
                Employees
            </a>

            <a href="{% url 'training_list' %}" class="btn btn-light btn-sm">
                Trainings
            </a>

            <a href="{% url 'enrollment_list' %}" class="btn btn-light btn-sm">
                Enrollments
            </a>

            <a href="{% url 'dashboard' %}" class="btn btn-warning btn-sm">
                Dashboard
            </a>

            <a href="{% url 'login' %}" class="btn btn-success btn-sm">
                Login
            </a>

            <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>

    </div>
</nav>

<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
