{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row mb-4">

    <div class="col-md-4">
        <div class="card bg-primary text-white">
            <div class="card-body">
                <h5>Total Employees</h5>
                <h2>{{ total_employees }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white">
            <div class="card-body">
                <h5>Total Trainings</h5>
                <h2>{{ total_trainings }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-warning text-dark">
            <div class="card-body">
                <h5>Total Enrollments</h5>
                <h2>{{ total_enrollments }}</h2>
            </div>
        </div>
    </div>

</div>

<div class="card">
    <div class="card-body">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('myChart').getContext('2d');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Employees', 'Trainings', 'Enrollments'],
        datasets: [{
            label: 'Count',
            data: [
                {{ total_employees }},
                {{ total_trainings }},
                {{ total_enrollments }}
            ],
            backgroundColor: [
                '#0d6efd',
                '#198754',
                '#ffc107'
            ],
            borderColor: [
                '#0d6efd',
                '#198754',
                '#ffc107'
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

{% endblock %}
